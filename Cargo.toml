[package]
name = "tpow"
version = "0.1.0"
edition = "2021"
description = "TPoW-v1: tensor-core proof of work. Reference implementation, trusted benchmark harness and CPU reference solver."
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

# TRUSTED: timing, sandboxing, audits, scoring. Never links contestant code.
[[bin]]
name = "tpow-bench"
path = "src/bin/tpow-bench.rs"

# Reference solver speaking the worker protocol on the CPU (tests, dev, CPU red-team baseline).
[[bin]]
name = "tpow-cpu-solver"
path = "src/bin/tpow-cpu-solver.rs"

# Known-answer-test generator / checker.
[[bin]]
name = "tpow-kat"
path = "src/bin/tpow-kat.rs"

[dependencies]
sha2 = { version = "0.10", features = ["compress"] }
rayon = "1.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "unwind"

[profile.test]
opt-level = 3

# Adversarial worker used only by the harness self-tests (tests/harness.rs).
[[bin]]
name = "tpow-evil-solver"
path = "src/bin/tpow-evil-solver.rs"
