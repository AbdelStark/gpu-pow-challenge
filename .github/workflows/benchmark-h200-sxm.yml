name: Benchmark h200-sxm

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-h200-sxm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    uses: ./.github/workflows/benchmark-gpu.yml
    with:
      track: h200-sxm
      # Dedicated, otherwise idle GPU host. benchmark.sh also takes a box-wide GPU lock.
      runs_on: '["self-hosted", "linux", "x64", "tpow-h200-sxm"]'
